[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "snitch"
authors = [
    {name = "Luca Colagrande", email = "colluca@iis.ee.ethz.ch"}
]
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    # Alphabetically sorted.
    "dataclasses",
    "gitpython",
    "humanize",
    "json5",
    "jsonref",
    "jsonschema",
    "mako",
    "matplotlib",
    "pandas",
    "peakrdl",
    "peakrdl-markdown",
    "peakrdl-rawheader>=0.1.1",
    "prettytable",
    "progressbar2",
    "psutil",
    "pyelftools",
    "pyflexfloat",
    "pymakeutils>=1.4.0",
    "pysynthutils",
    "pytablewriter",
    "pytest",
    "pyyaml",
    "riscv-opcodes",
    "spatz-vpu",
    "tabulate",
    "termcolor",
]

[project.optional-dependencies]
kernels  = [
    # Alphabetically sorted.
    "numpy",
    "scikit-learn",
    "torch",
]
docs = [
    "mkdocs",
    "mkdocs-exclude",
    "mkdocs-include-markdown-plugin",
    "mkdocs-macros-plugin",
    "mkdocs-material",
    "mkdocstrings",
    "mkdocstrings-python",
]
all = [
    "snitch[kernels,docs]"
]

[dependency-groups]
# Lint/format toolchain versions declared here are the single source of truth for
# .pre-commit-config.yaml's `system`-language hooks, and for the CI lint job.
dev = [
    # Alphabetically sorted.
    "clang-format==10.0.1.1",
    "flake8==7.3.0",
    "prek>=0.5.3",
    "rdlfmt>=0.3.0",
    "reuse[charset-normalizer,chardet]==6.2.0",
    "tsunami-wave @ git+https://github.com/zarubaf/tsunami.git@4a2d5c02462875fcebaef6f4e84563eb28b99cf8",
    "verible==0.0.4071.0",
    "yamllint==1.37.1",
]

[tool.uv.sources]
riscv-opcodes = { path = "sw/deps/riscv-opcodes", editable = true }
spatz-vpu = { path = "deps/spatz_vpu" }
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.package-dir]
"snitch.dnn" = "sw/kernels/dnn"
"snitch.blas" = "sw/kernels/blas"
"snitch.util" = "util"

[tool.pytest.ini_options]
testpaths = ["util/bench/tests"]
