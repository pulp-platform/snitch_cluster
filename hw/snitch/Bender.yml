package:
  name: snitch
  authors:
    - "Diyou Shen         <dishen@iis.ee.ethz.ch>"

dependencies:
  common_cells:
    git:      https://github.com/pulp-platform/common_cells.git
    version:  2.0.0-beta.2
  tech_cells_generic:
    git:      https://github.com/pulp-platform/tech_cells_generic.git
    version:  0.2.14
  reqrsp_interface:
    path: "../reqrsp_interface"

export_include_dirs:
  - include

sources:
  - files:
      # Level 0
      - src/snitch_pma_pkg.sv
      - src/snitch_riscv_instr.sv
      # Level 1
      - src/snitch_pkg.sv
      # Level 2
      - src/snitch_regfile_ff.sv
      - src/snitch_lsu.sv
      - src/snitch_l0_tlb.sv
  - target: not(disable_pmcs)
    defines:
      SNITCH_ENABLE_PERF:
    files:
      - src/snitch.sv
  # Disable the performance monitoring counters to save area.
  - target: disable_pmcs
    files:
      - src/snitch.sv
  - target: all(tb, not(verilator))
    files:
      - test/snitch_l0_tlb_tb.sv