name: lint
on: [push, pull_request]

env:
  TERM: xterm-256color
  FORCE_COLOR: 1

jobs:

  # Runs the same hooks as the local pre-commit install, so .pre-commit-config.yaml
  # is the single source of truth for linting, formatting and tool versions.
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.1.0
      # Only the lint toolchain (the `dev` dependency group) is needed here, so
      # we don't need to install all dependencies which would require a bender
      # checkout and submodule init.
      - name: Install lint toolchain
        run: uv sync --only-group dev --no-install-project --frozen
      - name: Run hooks on all files
        run: uv run --no-sync prek run --all-files --show-diff-on-failure
