name: setup-container
description: Set up the container's Bender and Python dependencies

runs:
  using: "composite"
  steps:
    # In containerized jobs, checkout is sometimes done by a different user
    # than the one running subsequent steps (root, possibly due to Docker),
    # which makes git refuse to operate on the repository.
    - name: Git config safe.directory
      shell: sh
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    # Cache the venv directory (fast subsequent jobs on same lockfile and Python version)
    - name: Cache venv
      uses: actions/cache@v4
      with:
        path: /repo/.venv
        key: venv-${{ hashFiles('uv.lock', '.python-version') }}

    # Cache uv's download/build cache
    - name: Cache uv downloads
      uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: uvcache-${{ hashFiles('uv.lock', '.python-version') }}

    # Cache the .bender directory (checked out Bender dependencies)
    - name: Cache Bender dependencies
      uses: actions/cache@v4
      with:
        path: .bender
        key: bender-${{ hashFiles('Bender.lock') }}

    # In container jobs the entrypoint's `bender checkout` runs before
    # actions/checkout populates the workspace, so it has no effect here and
    # we need to check out Bender dependencies again after checkout.
    - name: Checkout Bender dependencies
      shell: sh
      run: |
        bender checkout

    - name: Sync Python environment
      shell: sh
      run: |
        uv sync --extra all --locked
